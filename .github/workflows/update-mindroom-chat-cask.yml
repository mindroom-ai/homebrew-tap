name: Update MindRoom Chat cask

on:
  schedule:
    - cron: "53 8 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [mindroom-chat-release]

permissions:
  contents: write

concurrency:
  # Shared with update-mindroom-cask.yml, so only one cask update pushes at a time.
  group: update-casks
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # A queued run starts from the current tip, not the commit it was triggered at.
          ref: main

      - name: Update cask from release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_mindroom_cask.py --cask mindroom-chat

      - name: Validate cask
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          brew tap mindroom-ai/tap
          tap_dir="$(brew --repo mindroom-ai/tap)"
          cp Casks/mindroom-chat.rb "$tap_dir/Casks/mindroom-chat.rb"
          brew style --cask mindroom-ai/tap/mindroom-chat
          brew audit --cask --online mindroom-ai/tap/mindroom-chat
          brew install --cask --dry-run mindroom-ai/tap/mindroom-chat

      - name: Commit and push update
        run: |
          if git diff --quiet -- Casks/mindroom-chat.rb; then
            echo "No cask update needed."
            exit 0
          fi

          version="$(ruby -ne 'puts $1 if /^  version "([^"]+)"/ =~ $_' Casks/mindroom-chat.rb)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/mindroom-chat.rb
          git commit -m "Update MindRoom Chat cask to v${version}"
          git push
